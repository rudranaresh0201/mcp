[project]
name = "verimcp"
version = "0.4.0"
description = "A standalone MCP server that proxies real MCP backends and verifies tool-call postconditions before results reach the client"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Rudra Naresh"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    # API-only, no exporter deps -- always safe to import. verimcp/telemetry.py
    # calls only this; the SDK (real span/metric export) is an opt-in extra
    # below, wired up lazily so a plain `pip install verimcp` never pulls in
    # exporter dependencies it might not use.
    "opentelemetry-api>=1.27",
    # SchemaConformanceVerifier: validates structuredContent against a
    # tool's own declared outputSchema (JSON Schema 2020-12, per the MCP
    # spec). Not optional -- this verifier is always appended, not opt-in.
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/rudranaresh0201/mcp"
Repository = "https://github.com/rudranaresh0201/mcp"

[project.scripts]
verimcp = "verimcp.cli:main"
verimcp-dashboard = "verimcp.dashboard.server:main"

[project.entry-points."verimcp.verifiers"]
filesystem = "verimcp.verifiers.filesystem:FilesystemVerifier"
git_commit = "verimcp.verifiers.git_commit:GitCommitVerifier"
git_branch = "verimcp.verifiers.git_branch:GitBranchVerifier"
ci_run = "verimcp.verifiers.ci_run:CIRunVerifier"
resource_read = "verimcp.verifiers.resource_read:ResourceReadVerifier"
git_server_commit = "verimcp.verifiers.git_server_commit:GitServerCommitVerifier"
sqlite = "verimcp.verifiers.sqlite:SQLiteVerifier"
docker = "verimcp.verifiers.docker:DockerVerifier"
github = "verimcp.verifiers.github:GitHubVerifier"

[project.optional-dependencies]
# Real span/metric export -- Console for local debugging, OTLP for pointing
# a free viewer (Jaeger, Grafana) at verimcp traffic. Not required to run
# verimcp at all: with this extra absent, --otel-exporter is simply unset
# and every telemetry call in proxy.py is a true no-op (see
# docs/adr/0005-metrics-via-otel-genai-conventions.md).
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
# The console (verimcp-dashboard): reads the audit log a proxy run already
# wrote and streams it to a browser. Optional because verimcp's own proxy
# path never imports it -- a core install stays free of a web framework, the
# same way `otel` keeps exporter deps out of it.
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # The console streams events over a WebSocket, and plain uvicorn ships no
    # WebSocket implementation -- without this, a fresh `pip install
    # verimcp[dashboard]` serves the page but every live connection is
    # refused ("No supported WebSocket library detected"). Found by a manual
    # install into a clean venv; the dev environment had it transitively.
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    # mcp-server-git is the real, third-party MCP backend used to prove
    # verimcp works genuinely in front of a backend it didn't write (see
    # docs/ROADMAP.md Phase 1). Pinned below mcp 2.0.0 deliberately: that
    # SDK release (paired with the 2026-07-28 stateless spec) dropped the
    # low-level @server.list_tools()-style decorator API mcp-server-git
    # 2026.7.10 is still written against -- without this pin, pip resolves
    # the newest mcp and mcp-server-git crashes on startup.
    "mcp-server-git>=2026.7.10",
    "mcp<2.0.0",
    # tests/test_telemetry.py needs the SDK's in-memory span/metric readers
    # to assert real instrumentation output, not just "it didn't crash".
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    # Local build/publish tooling (Phase 8) -- this project prepares a
    # publish-ready package but does not run `twine upload` itself; that
    # needs the maintainer's own PyPI credentials.
    "build>=1.0",
    "twine>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30

# index.html is the console itself, not a build artifact -- it must ship
# inside the wheel or `verimcp-dashboard` serves a 404 after a pip install.
[tool.setuptools.package-data]
verimcp = ["dashboard/static/*.html"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately shell out (git init/commit, docker) to build real
# fixtures inside async test functions; blocking there is the point, not a bug.
"**/tests/**" = ["ASYNC221"]
