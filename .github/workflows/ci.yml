name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verimcp
        run: pip install -e ".[dev]"
      - name: Install devmcp
        run: pip install -e "./devmcp[dev]"
      - name: Install example third-party verifier plugin
        run: pip install -e examples/third_party_verifier
      - name: Lint
        run: |
          ruff check src tests
          ruff check devmcp/src devmcp/tests
      - name: Test verimcp
        run: pytest tests
      - name: Test devmcp
        run: pytest devmcp/tests
